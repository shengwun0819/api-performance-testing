name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  k6-smoke-test:
    name: k6 smoke test against mock-server
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies (ESLint)
        run: npm install

      - name: Install mock-server dependencies
        run: |
          cd mock-server
          npm install

      - name: Start mock-server
        run: |
          cd mock-server
          npm start &
          sleep 5

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          version: v0.51.0

      - name: Install load-test dependencies
        run: |
          cd load-test
          npm install

      - name: Run k6 smoke test (short)
        env:
          BASE_URL: http://localhost:4000
          K6_DURATION: 10s
          K6_RATE: 2
          K6_VUS: 4
        run: |
          cd load-test
          k6 run tests/api-load.test.js

  docker-compose-grafana:
    name: Grafana + InfluxDB (docker-compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Grafana stack
        run: |
          cd grafana
          docker compose up -d

      - name: Wait for InfluxDB
        run: |
          INFLUX_URL="http://localhost:8087/query?q=show+databases&u=admin&p=admin"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$INFLUX_URL" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then echo "InfluxDB is up"; break; fi
            echo "Waiting for InfluxDB... ($i/30) (HTTP $code)"
            sleep 2
          done
          curl -sf "$INFLUX_URL" -o /dev/null

      - name: Wait for Grafana
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Grafana is up"
              break
            fi
            echo "Waiting for Grafana... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:3000/api/health

      - name: Stop Grafana stack
        if: always()
        run: |
          cd grafana
          docker compose down -v

