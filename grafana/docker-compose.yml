# InfluxDB v1 + Grafana for k6 real-time metrics.
# Run from this directory: docker compose up -d
# Then: k6 run --out influxdb=http://localhost:8086/k6 ../load-test/tests/api-load.test.js
# Grafana: http://localhost:3000 (admin / admin)
# Import dashboard ID 24708 for k6 InfluxDB v1.

services:
  influxdb:
    image: influxdb:1.8
    container_name: k6-influxdb
    ports:
      - "8087:8086" # host 8087 避免與本機 8086 衝突
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin
    volumes:
      - influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:latest
    container_name: k6-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  grafana-data:
